name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Node dependencies
        run: npm install

      - name: Build UniApp H5 resources
        run: npx uni build -p h5

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses 2>/dev/null || true

      - name: Copy H5 resources to Android assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r dist/build/h5/* android/app/src/main/assets/www/
          echo "=== Assets contents ==="
          find android/app/src/main/assets/www -type f | head -30
          echo "=== index.html check ==="
          test -f android/app/src/main/assets/www/index.html && echo "EXISTS" || echo "MISSING"

      - name: Generate app icons
        run: |
          python3 << 'PYEOF'
          import struct, zlib, os
          def create_png(width, height, r, g, b):
              def chunk(chunk_type, data):
                  c = chunk_type + data
                  return struct.pack('>I', len(data)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
              raw = b''
              for y in range(height):
                  raw += b'\x00' + bytes([r, g, b]) * width
              return b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 2, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(raw)) + chunk(b'IEND', b'')
          for density, size in [('mdpi', 48), ('hdpi', 72), ('xhdpi', 96), ('xxhdpi', 144), ('xxxhdpi', 192)]:
              d = f'android/app/src/main/res/mipmap-{density}'
              os.makedirs(d, exist_ok=True)
              with open(f'{d}/ic_launcher.png', 'wb') as f:
                  f.write(create_png(size, size, 255, 107, 53))
          print('Icons generated')
          PYEOF

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daojia-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
