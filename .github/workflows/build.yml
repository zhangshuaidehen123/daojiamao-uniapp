name: Build UniApp APK

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'android/**'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Node dependencies
        run: npm install

      - name: Build UniApp App resources
        run: npx uni build -p app
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download base APK
        run: |
          curl -L -o base-app.apk \
            "https://github.com/zhangshuaidehen123/daojiamao-uniapp/releases/download/base-apk-v2.4.0/base-app.apk"
          ls -lh base-app.apk

      - name: Install apktool
        run: |
          wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          wget -q https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -O /usr/local/bin/apktool.jar
          chmod +x /usr/local/bin/apktool

      - name: Decode base APK
        run: |
          apktool d base-app.apk -o decoded -f
          echo "=== Decoded structure ==="
          find decoded/assets/apps -type d | head -10

      - name: Replace UniApp www resources
        run: |
          # UniApp build output is in dist/build/app/
          # The original APK stores app resources at assets/apps/__UNI__2050351/www/
          WWW_DIR="decoded/assets/apps/__UNI__2050351/www"

          if [ ! -d "$WWW_DIR" ]; then
            echo "ERROR: $WWW_DIR not found!"
            find decoded/assets -type d | head -20
            exit 1
          fi

          # Clear old www content
          rm -rf "$WWW_DIR"/*

          # Copy new build output
          # UniApp app build outputs to dist/build/app/
          if [ -d "dist/build/app" ]; then
            cp -r dist/build/app/* "$WWW_DIR/"
            echo "=== Copied from dist/build/app ==="
          elif [ -d "dist/build/h5" ]; then
            # Fallback: if app build produces H5 output
            cp -r dist/build/h5/* "$WWW_DIR/"
            echo "=== Copied from dist/build/h5 (fallback) ==="
          else
            echo "ERROR: No build output found!"
            find dist -type f | head -30
            exit 1
          fi

          echo "=== New www contents ==="
          find "$WWW_DIR" -type f | head -30
          echo "=== Total files ==="
          find "$WWW_DIR" -type f | wc -l

          # Update version in manifest.json if exists
          if [ -f "$WWW_DIR/manifest.json" ]; then
            echo "=== manifest.json ==="
            cat "$WWW_DIR/manifest.json" | head -5
          fi

      - name: Rebuild APK
        run: |
          apktool b decoded -o rebuilt.apk
          ls -lh rebuilt.apk

      - name: Sign APK with debug key
        run: |
          # Generate debug keystore if not exists
          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Align
          zipalign -f 4 rebuilt.apk aligned.apk

          # Sign with apksigner (v2 signing)
          apksigner sign \
            --ks ~/.android/debug.keystore \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android \
            --out daojia-app-signed.apk \
            aligned.apk

          # Verify
          apksigner verify daojia-app-signed.apk
          ls -lh daojia-app-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daojia-app-unsigned
          path: daojia-app-signed.apk
          retention-days: 30

      - name: Create Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: daojia-app-signed.apk
