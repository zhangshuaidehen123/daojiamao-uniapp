name: Build UniApp APK

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'android/**'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Node dependencies
        run: npm install

      - name: Build UniApp App resources
        run: npx uni build -p app
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Verify build output
        run: |
          echo "=== dist/build/app structure ==="
          find dist/build/app -type f | head -30
          echo "=== Total files ==="
          find dist/build/app -type f | wc -l

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install apktool and android tools
        run: |
          # Install apktool via apt
          sudo apt-get update -qq
          sudo apt-get install -y -qq apktool zipalign

          # Install apksigner from Android SDK
          ANDROID_BUILD_TOOLS=$(ls -d ${ANDROID_HOME}/build-tools/*/ | tail -1)
          echo "ANDROID_BUILD_TOOLS=$ANDROID_BUILD_TOOLS"
          ls "$ANDROID_BUILD_TOOLS"

      - name: Download base APK
        run: |
          curl -L -o base-app.apk \
            "https://github.com/zhangshuaidehen123/daojiamao-uniapp/releases/download/base-apk-v2.4.0/base-app.apk"
          ls -lh base-app.apk

      - name: Decode base APK
        run: |
          apktool d base-app.apk -o decoded -f
          echo "=== Decoded assets structure ==="
          find decoded/assets/apps -type d | head -10
          echo "=== Original www files ==="
          find decoded/assets/apps -type f | head -20

      - name: Replace UniApp www resources
        run: |
          WWW_DIR="decoded/assets/apps/__UNI__2050351/www"

          if [ ! -d "$WWW_DIR" ]; then
            echo "ERROR: $WWW_DIR not found!"
            find decoded/assets -type d | head -20
            exit 1
          fi

          # Clear old www content
          rm -rf "$WWW_DIR"/*

          # Copy new build output from dist/build/app/
          if [ -d "dist/build/app" ]; then
            cp -r dist/build/app/* "$WWW_DIR/"
            echo "=== Copied from dist/build/app ==="
          else
            echo "ERROR: dist/build/app not found!"
            find dist -type f | head -30
            exit 1
          fi

          echo "=== New www contents ==="
          find "$WWW_DIR" -type f | head -30
          echo "=== Total www files ==="
          find "$WWW_DIR" -type f | wc -l

      - name: Rebuild APK
        run: |
          apktool b decoded -o rebuilt.apk
          ls -lh rebuilt.apk

      - name: Sign APK with debug key
        run: |
          # Generate debug keystore
          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Zipalign
          zipalign -f 4 rebuilt.apk aligned.apk

          # Sign with apksigner
          ANDROID_BUILD_TOOLS=$(ls -d ${ANDROID_HOME}/build-tools/*/ | tail -1)
          "${ANDROID_BUILD_TOOLS}apksigner" sign \
            --ks ~/.android/debug.keystore \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android \
            --out daojia-app-signed.apk \
            aligned.apk

          # Verify
          "${ANDROID_BUILD_TOOLS}apksigner" verify daojia-app-signed.apk
          ls -lh daojia-app-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daojia-app
          path: daojia-app-signed.apk
          retention-days: 30
